
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trdes"
version = "0.1.0"
description = "Modernized TRDES utilities (Python CLI)"
authors = [{name = "Gary Christen"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
trdes = "trdes.cli:main"
